<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="22" fill="#1f2428"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Three columns, which is the shape of the board itself. -->
  <g fill="#2c333a">
    <rect x="16" y="22" width="30" height="84" rx="4"/>
    <rect x="49" y="22" width="30" height="84" rx="4"/>
    <rect x="82" y="22" width="30" height="84" rx="4"/>
  </g>

  <!-- Cards, fewer in each column from left to right. -->
  <g fill="#c9d1d9">
    <rect x="21" y="28" width="20" height="13" rx="2"/>
    <rect x="21" y="45" width="20" height="13" rx="2"/>
    <rect x="21" y="62" width="20" height="13" rx="2"/>
    <rect x="54" y="28" width="20" height="13" rx="2"/>
    <rect x="54" y="45" width="20" height="13" rx="2"/>
  </g>

  <!-- The last column holds a markdown hash, because a card is a markdown file. -->
  <g stroke="#7ee787" stroke-width="4" stroke-linecap="round">
    <line x1="93" y1="30" x2="90" y2="48"/>
    <line x1="104" y1="30" x2="101" y2="48"/>
    <line x1="88" y1="36" x2="106" y2="36"/>
    <line x1="87" y1="42" x2="105" y2="42"/>
  </g>
</svg>
